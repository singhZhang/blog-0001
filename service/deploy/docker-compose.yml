# 生产环境部署编排。完整发布与操作手册见同目录 README.md。

name: blog-service

services:
  blog-service:
    image: ${BLOG_IMAGE:-blog-service:local}
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: blog-service
    restart: unless-stopped
    # 默认只绑定回环地址：外部流量统一经反向代理进入。
    # 需要直接对外暴露时在 .env 中改为 0.0.0.0:8080。
    ports:
      - "${BLOG_BIND:-127.0.0.1:8080}:8080"
    environment:
      # 容器内端口固定 8080（镜像健康检查依赖此值）。
      PORT: "8080"
      # 生产必填：允许跨域访问 API 的前端来源。缺失时 compose 直接报错，
      # 避免带着代码里的本地开发默认值上线。
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?请在 deploy/.env 中设置 CORS_ALLOWED_ORIGINS}
      MYSQL_HOST: ${MYSQL_HOST:-47.94.248.206}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-blog}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-blog-admin}
      BLOG_CONTENT_DIR: /app/content/articles
    # 服务只读不写：文章启动时加载进内存，文件系统可整体只读。
    read_only: true
    # 文章内容默认随镜像发布。需要不重建镜像更新文章时，
    # 改用宿主机目录挂载（只读），挂载点保持镜像内路径不变：
    # volumes:
    #   - /srv/blog/articles:/app/content/articles:ro
    # 优雅停机：应用最长等待 10s 排空存量请求，给足余量避免被 SIGKILL。
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M
